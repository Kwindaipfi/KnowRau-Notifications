#### Important things to know
#  **1. Database connection**
#The configuration expects this database container:
#  | Setting | Value |
#  |---|---|
#  | Container | `brainwave-notifications-postgres` |
#  | Database | `brainwaze_notification_db` |
#  | Host port | `5436` |
#  | Username | `postgres` |
#  | Password | `ChangeMe_Notification_2026!` |
#  The password must match the one you actually used when creating the container. If you chose a different password, update the YAML accordingly.
#  **2. Hibernate and Flyway**
#- `ddl-auto: validate` means Hibernate checks that your database schema matches your entities; it will not create tables automatically.
#- `flyway.enabled: true` enables Flyway database migrations.
#- We'll create the initial migration under `src/main/resources/db/migration/`, for example `V1__create_notifications_table.sql`.
#  **3. JWT security**
#  Replace `REPLACE_WITH_YOUR_AUTH_SERVICE_JWT_SECRET` with the actual JWT signing secret used by your authentication service. The Notification Service must validate tokens using the same compatible signing configuration as your authentication service.
#  **4. Email and SMS**
#  Both channels are disabled for now. We'll implement in-app notifications first, then configure email and SMS when you're ready.
#  **5. Local development only**
#  Hard-coding credentials is acceptable temporarily for local development, but don't commit real secrets to Git or use these settings in production.
