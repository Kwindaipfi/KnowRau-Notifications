spring:
  application:
    name: KnowRauNotificationService

  datasource:
    url: jdbc:postgresql://localhost:5436/brainwaze_notification_db
    username: postgres
    password: "Aluwani071@@@@@"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  mail:
    host: ""
    port: 587
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: knowrau-notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: org.BrainWaze.notification.dto

    listener:
      ack-mode: record

server:
  port: 8089

security:
  jwt:
    secret: "YTg3NmY0ZDJkNjY5NjQ1M2Q3YzM5NzQ0YzY0N2QyZjQ5YzJhZDY0YjM3Zg=="
  service:
    token: "notification-service-dev-token-2026"

cors:
  allowed-origins:
    - http://localhost:4200
    - http://localhost:4300

notifications:
  channels:
    email:
      enabled: false
      from: no-reply@brainwaze.local
      from-name: BrainWaze

    sms:
      enabled: false